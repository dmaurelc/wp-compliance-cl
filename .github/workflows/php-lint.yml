name: PHP Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Release metadata
        run: php tests/release-metadata.php
      - name: Schema contract
        run: php tests/schema-contract.php
      - name: Update provider contract
        run: php tests/update-provider-contract.php
